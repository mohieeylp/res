apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar-system-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solar-system
  template:
    metadata:
      labels:
        app: solar-system
    spec:
      containers:
      - name: solar-system
        image: siddharth67/solar-system:v3
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: solar-system-service
spec:
  type: NodePort
  selector:
    app: solar-system
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
